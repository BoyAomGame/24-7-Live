# The switcher owns /program. Send a live feed to /incoming using either RTMP or SRT.
api: yes
apiAddress: :9997

# This sample is intentionally open on the LAN. Put this behind a firewall or add
# MediaMTX authentication before exposing it to the public internet.
authInternalUsers:
  - user: any
    permissions:
      - action: publish
      - action: read
      - action: api

rtmp: yes
srt: yes

pathDefaults:
  source: publisher
  overridePublisher: true

paths:
  media:
    # Keep the switcher's reader connected across playlist item boundaries.
    overridePublisher: true
    alwaysAvailable: true
    alwaysAvailableFile: /offline/bars.mp4
  incoming:
    # A new encoder may replace a stale incoming feed.
    overridePublisher: true
    # Preserve the received source before the switcher changes its format.
    # Files are written to ./recordings/incoming/ on the host machine.
    record: yes
    recordPath: /recordings/%path/%Y-%m-%d_%H-%M-%S-%f
    recordFormat: fmp4
    recordPartDuration: 1s
    recordSegmentDuration: 1h
    recordDeleteAfter: 0s
  program:
    # MediaMTX itself fills publisher gaps from this clip without disconnecting
    # readers. The clip is generated by the fallback init service.
    overridePublisher: false
    alwaysAvailable: true
    alwaysAvailableFile: /offline/bars.mp4
